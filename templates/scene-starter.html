<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>promo scene</title>
<style>
  @font-face{font-family:P;src:url('fonts/Poppins-200.woff2') format('woff2');font-weight:200;font-display:block}
  @font-face{font-family:P;src:url('fonts/Poppins-300.woff2') format('woff2');font-weight:300;font-display:block}
  @font-face{font-family:P;src:url('fonts/Poppins-400.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:P;src:url('fonts/Poppins-500.woff2') format('woff2');font-weight:500;font-display:block}
  @font-face{font-family:P;src:url('fonts/Poppins-600.woff2') format('woff2');font-weight:600;font-display:block}

  :root{
    --blue:#3b82ff;
    --blue2:#6aa1ff;
    --blue3:#9dbcff;
    --ink:#eaf1ff;
    --glow:rgba(38,102,255,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;overflow:hidden}
  #stage{
    position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(120% 70% at 50% 0%, #061029 0%, #030916 45%, #01050f 100%),
      #01040d;
    font-family:P,-apple-system,Helvetica,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform,opacity}
  .ray{position:absolute;filter:blur(40px);mix-blend-mode:screen;will-change:transform,opacity}
  .dot{position:absolute;border-radius:50%;background:#cfe0ff;will-change:transform,opacity}
  .vig{position:absolute;inset:0;background:radial-gradient(115% 80% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%)}
  .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay}

  .t{font-weight:400;letter-spacing:-.5px;line-height:1.12;text-align:center;will-change:transform,opacity,filter}
  .xl{font-size:104px}
  .lg{font-size:88px}
  .md{font-size:66px}
  .sm{font-size:46px}
  .xs{font-size:34px}
  .b{color:var(--blue2)}
  .w300{font-weight:300}
  .w500{font-weight:500}
  .w600{font-weight:600}
  .soft{color:#94a9cf}

  .ring{
    position:absolute;width:820px;height:820px;border-radius:50%;
    border:26px solid rgba(59,130,255,.95);
    filter:blur(26px);
    box-shadow:0 0 160px 40px rgba(45,110,255,.55), inset 0 0 120px 20px rgba(45,110,255,.5);
    will-change:transform,opacity;
  }
  .ringSharp{
    position:absolute;width:820px;height:820px;border-radius:50%;
    border:3px solid rgba(160,195,255,.85);filter:blur(1px);
    will-change:transform,opacity;
  }

  /* ---------- horizon ---------- */
  .horizon{position:absolute;left:50%;top:1180px;width:1500px;height:5px;transform:translateX(-50%);
    background:linear-gradient(90deg,rgba(120,170,255,0),#dce9ff 30%,#ffffff 50%,#dce9ff 70%,rgba(120,170,255,0));
    box-shadow:0 0 60px 18px rgba(60,130,255,.85),0 0 160px 60px rgba(40,100,255,.45);
    will-change:transform,opacity}
  .slab{
    position:absolute;left:50%;top:760px;width:760px;height:420px;
    transform:translateX(-50%);
    background:linear-gradient(180deg,rgba(20,45,110,.55),rgba(8,20,55,.15));
    border:1px solid rgba(120,170,255,.28);
    border-bottom:none;
    box-shadow:0 40px 120px rgba(20,70,200,.35);
    will-change:transform,opacity;
  }

  /* ---------- mock UI ---------- */
  .dash{
    width:880px;border-radius:26px;padding:28px 30px 30px;
    background:linear-gradient(180deg,#0b1428 0%,#060d1e 100%);
    border:1px solid rgba(96,142,255,.24);
    box-shadow:0 50px 140px rgba(4,20,70,.85), inset 0 1px 0 rgba(255,255,255,.06);
    will-change:transform,opacity;
  }
  .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .dtitle{font-size:30px;font-weight:500;letter-spacing:-.3px}
  .pill{font-size:19px;padding:8px 16px;border-radius:999px;background:rgba(59,130,255,.16);color:var(--blue3);border:1px solid rgba(96,142,255,.3)}
  .kpis{display:flex;gap:18px;margin-bottom:26px}
  .kpi{flex:1;background:rgba(255,255,255,.035);border:1px solid rgba(120,160,255,.16);border-radius:18px;padding:18px 20px;will-change:transform,opacity}
  .klab{font-size:19px;color:#8fa4cc;font-weight:300;margin-bottom:8px}
  .kval{font-size:44px;font-weight:500;letter-spacing:-1px}
  .kdelta{display:inline-block;margin-top:10px;font-size:18px;padding:4px 12px;border-radius:999px}
  .up{background:rgba(34,197,124,.16);color:#5fe0a4}
  .down{background:rgba(255,86,110,.14);color:#ff8b9c}
  .chartbox{position:relative;height:330px;border-radius:18px;background:rgba(255,255,255,.025);border:1px solid rgba(120,160,255,.14);padding:22px 22px 18px;overflow:hidden}
  .grid{position:absolute;left:22px;right:22px;height:1px;background:rgba(150,180,255,.11)}
  .bars{position:absolute;left:30px;right:30px;bottom:44px;height:230px;display:flex;align-items:flex-end;gap:14px}
  .bar{flex:1;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#4c8bff,#1d4fd8);transform-origin:50% 100%;will-change:transform}
  .bar.hi{background:linear-gradient(180deg,#8fb6ff,#3b82ff);box-shadow:0 0 30px rgba(80,140,255,.6)}
  .xax{position:absolute;left:30px;right:30px;bottom:16px;display:flex;justify-content:space-between;font-size:16px;color:#7186ad;font-weight:300}
  .flag{position:absolute;padding:7px 13px;border-radius:12px;background:#0d1a38;border:1px solid rgba(140,180,255,.45);font-size:18px;color:#cfe0ff;white-space:nowrap;box-shadow:0 12px 40px rgba(0,20,80,.7);will-change:transform,opacity}

  .rows{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:16px;padding:15px 18px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(120,160,255,.12);will-change:transform,opacity}
  .rdot{width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 16px var(--blue);flex:none}
  .rtxt{font-size:22px;font-weight:300;color:#cbd9f5}
  .rnum{margin-left:auto;font-size:22px;font-weight:500;color:#fff}

  /* action card */
  .act{display:flex;gap:20px;align-items:flex-start;width:860px;padding:26px 28px;border-radius:20px;
    background:linear-gradient(180deg,rgba(14,25,52,.95),rgba(7,13,30,.95));
    border:1px solid rgba(96,142,255,.26);box-shadow:0 30px 90px rgba(3,14,50,.8);will-change:transform,opacity}
  .chk{width:52px;height:52px;flex:none}
  .atxt{font-size:34px;font-weight:500;line-height:1.25;letter-spacing:-.3px}
  .asub{font-size:22px;font-weight:300;color:#8fa4cc;margin-top:8px;line-height:1.35}

  /* chips */
  .chip{display:flex;align-items:center;gap:14px;padding:18px 26px;border-radius:999px;
    background:rgba(255,255,255,.045);border:1px solid rgba(120,165,255,.28);
    font-size:34px;font-weight:300;white-space:nowrap;box-shadow:0 20px 60px rgba(3,14,50,.6);will-change:transform,opacity}
  .cico{width:38px;height:38px;flex:none}

  /* devices */
  .laptop{position:relative;width:900px;will-change:transform,opacity}
  .lscreen{width:900px;height:570px;border-radius:20px;background:#050b18;border:12px solid #131c33;
    box-shadow:0 50px 140px rgba(4,20,70,.9), inset 0 0 60px rgba(0,0,0,.6);overflow:hidden;position:relative}
  .lbase{width:1000px;height:22px;margin:0 auto;border-radius:0 0 18px 18px;background:linear-gradient(180deg,#1a2440,#0d1424);transform:translateX(-50px)}
  .phone{position:absolute;width:330px;height:680px;border-radius:44px;background:#060d1c;border:10px solid #17203a;
    box-shadow:0 50px 130px rgba(2,12,50,.95);overflow:hidden;will-change:transform,opacity}

  .fcard{position:absolute;width:780px;padding:38px 42px;border-radius:24px;
    background:linear-gradient(180deg,rgba(17,30,62,.96),rgba(7,14,34,.96));
    border:1px solid rgba(110,155,255,.3);box-shadow:0 40px 120px rgba(4,18,70,.85);will-change:transform,opacity}
  .fk{font-size:50px;font-weight:500;letter-spacing:-.4px;margin-bottom:14px}
  .fv{font-size:31px;font-weight:300;color:#9db1d8;line-height:1.42}

  svg.doodle{position:absolute;overflow:visible;pointer-events:none}
  .dpath{fill:none;stroke:var(--blue2);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 14px rgba(70,130,255,.85))}
  .cursor{position:absolute;width:0;height:0}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* =======================================================================
   SCENE — a deterministic timeline. seek(t) renders the frame at time t.

   Everything below the HARNESS section is example content: three beats and
   an outro, showing the patterns worth copying (kinetic type, a UI mockup,
   a proof card on the horizon, a logo lockup). Replace them with the beats
   from your beat sheet. Keep the harness as-is — it encodes real bugs.
   ======================================================================= */
const BRAND   = "PLACEHOLDER";               // <- rebrand here
const TAGLINE = "One line on what it does.";
const SITE    = "example.com";
const DUR     = 24;                          // seconds — must match the beat sheet

/* ============================== HARNESS ==============================
   Do not rewrite. Two rules are baked in here:
   1. ONE animation per element covering enter -> hold -> exit. Two separate
      animations with fill:'both' fight: the exit clip applies its first
      keyframe from t=0 and pins the element visible for the whole video.
   2. Determinism. Seeded RNG, no Date.now()/Math.random() at render time.
   ===================================================================== */

let _s = 20260727;                            // any fixed seed
function rnd(){ _s |= 0; _s = _s + 0x6D2B79F5 | 0;
  let t = Math.imul(_s ^ _s >>> 15, 1 | _s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a,b)=>a+(b-a)*rnd();

const stage = document.getElementById('stage');
const anims = [];
function E(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html; return e; }
function add(parent, tag, cls, html){ const e=E(tag,cls,html); parent.appendChild(e); return e; }
function layer(){ const d=E('div','layer'); stage.appendChild(d); return d; }
function css(e,o){ Object.assign(e.style,o); return e; }

const EASE_OUT = 'cubic-bezier(.16,.84,.28,1)';
const EASE_IN  = 'cubic-bezier(.6,.02,.9,.3)';

function A(el, kf, start, dur, ease){
  const a = el.animate(kf, {duration:Math.max(dur,.001)*1000, delay:start*1000,
                            fill:'both', easing:ease||'linear'});
  a.pause(); anims.push(a); return a;
}
/* hard visibility window — the element is simply absent outside [a,b] */
function win(el, a, b){
  const k = [
    {opacity:0, offset:0, easing:'steps(1,end)'},
    {opacity:1, offset:Math.max(.0001,a/DUR), easing:'steps(1,end)'},
    {opacity:1, offset:Math.min(.9999,b/DUR), easing:'steps(1,end)'},
    {opacity:0, offset:1}
  ];
  const an = el.animate(k, {duration:DUR*1000, fill:'both', easing:'linear'});
  an.pause(); anims.push(an); return an;
}
/* the one animation per element: enter -> hold -> exit */
function io(el, from, shown, to, tIn, inD, tOut, outD, ez1, ez2){
  const hasOut = (tOut != null);
  const total  = (hasOut ? tOut + outD : tIn + inD) - tIn;
  const f = [ Object.assign({offset:0, easing:ez1||EASE_OUT}, from),
              Object.assign({offset:Math.min(inD/total,.999), easing:'linear'}, shown) ];
  if(hasOut){
    f.push(Object.assign({offset:Math.max((tOut-tIn)/total, inD/total+.001), easing:ez2||EASE_IN}, shown));
    f.push(Object.assign({offset:1}, to));
  }
  return A(el, f, tIn, total, 'linear');
}
/* state shorthand: opacity, transform, filter */
const S = (o,t,f)=>({opacity:o, transform:t||'none', filter:f||'blur(0px)'});

/* blur-in / blur-out — the default move for every text line */
function pop(el, tIn, tOut, o){
  o = o||{};
  const dy=o.dy!==undefined?o.dy:34, inD=o.inD||.5, outD=o.outD||.38,
        bl=o.blur!==undefined?o.blur:22, sc=o.sc!==undefined?o.sc:.965;
  io(el, S(0, `translateY(${dy}px) scale(${sc})`, `blur(${bl}px)`),
         S(1, 'translateY(0px) scale(1)'),
         S(0, `translateY(${-dy*.8}px) scale(${2-sc})`, `blur(${bl*.8}px)`),
     tIn, inD, tOut, outD);
}
/* directional swap with motion blur — for rapid word cycling */
function swap(el, tIn, tOut, inD, outD){
  io(el, S(0, 'translateX(46px) skewX(-9deg)', 'blur(16px)'),
         S(1, 'translateX(0px) skewX(0deg)'),
         S(0, 'translateX(-46px) skewX(9deg)', 'blur(16px)'),
     tIn, inD||.22, tOut, outD||.18, EASE_OUT, 'linear');
}
/* stroke draw-on, for hand-drawn underlines, arrows, ticks */
function draw(path, t, d){
  const L = path.getTotalLength();
  path.style.strokeDasharray = L; path.style.strokeDashoffset = L;
  A(path,[{strokeDashoffset:L},{strokeDashoffset:0}], t, d||.5, EASE_OUT);
}
function svg(parent, w, h, d, cls){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('class', cls||'doodle'); s.setAttribute('width',w); s.setAttribute('height',h);
  s.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('class','dpath'); p.setAttribute('d',d);
  s.appendChild(p); parent.appendChild(s); return {s,p};
}

/* ====================== ATMOSPHERE (keep as-is) ======================
   Rays must stay wide and heavily blurred. Narrow rotated gradient bars
   read as giant letter-shaped artifacts across the frame.
   ===================================================================== */
(function background(){
  const bg = layer(); css(bg,{zIndex:0});

  [{x:'12%', y:'16%', w:900, c:'rgba(22,66,175,.40)'},
   {x:'84%', y:'32%', w:760, c:'rgba(16,48,145,.36)'},
   {x:'46%', y:'90%', w:1020,c:'rgba(18,54,160,.34)'},
   {x:'72%', y:'74%', w:620, c:'rgba(36,88,215,.24)'}].forEach(b=>{
    const d = add(bg,'div','blob');
    css(d,{left:b.x, top:b.y, width:b.w+'px', height:b.w+'px',
      background:`radial-gradient(circle at 50% 50%, ${b.c} 0%, rgba(10,30,90,0) 68%)`,
      marginLeft:(-b.w/2)+'px', marginTop:(-b.w/2)+'px'});
    A(d,[{transform:'translate(0px,0px) scale(1)', opacity:.85},
         {transform:`translate(${rr(-90,90)}px,${rr(-120,60)}px) scale(1.18)`, opacity:1},
         {transform:`translate(${rr(-70,70)}px,${rr(-60,110)}px) scale(1)`,    opacity:.8}],
      0, DUR, 'ease-in-out');
  });

  for(let i=0;i<4;i++){
    const r = add(bg,'div','ray'); const w = rr(340,560);
    css(r,{left:(rr(8,92))+'%', top:'-460px', width:w+'px', height:'2400px',
      filter:'blur(130px)', marginLeft:(-w/2)+'px',
      background:'linear-gradient(180deg, rgba(80,140,255,.16), rgba(80,140,255,0) 78%)',
      transform:`rotate(${rr(-16,16)}deg)`, transformOrigin:'50% 0%'});
    A(r,[{opacity:.35},{opacity:.75},{opacity:.4}], 0, DUR, 'ease-in-out');
  }

  for(let i=0;i<64;i++){
    const d = add(bg,'div','dot'); const s = rr(1.6,4.4);
    css(d,{left:rr(2,98)+'%', top:rr(2,98)+'%', width:s+'px', height:s+'px',
      boxShadow:`0 0 ${rr(6,18)}px rgba(180,210,255,.9)`});
    A(d,[{opacity:0, transform:'translateY(0px)'},
         {opacity:rr(.25,.85), transform:`translateY(${rr(-70,-16)}px)`},
         {opacity:0, transform:`translateY(${rr(-150,-40)}px)`}],
      rr(0,DUR*.6), rr(7,15), 'ease-in-out');
  }
  add(bg,'div','vig');
})();

/* ####################################################################
   EXAMPLE BEATS — replace everything below with your own beat sheet.
   #################################################################### */

/* ---- BEAT 1: hook -------------------------------------------------
   Each line must fully exit before the next enters. Two legible lines
   mid-crossfade reads as a rendering bug, not a transition.
   ------------------------------------------------------------------- */
(function hook(){
  const qs = [
    {t:0.00, o:0.92, a:'A symptom they',   b:'felt <span class="b">this week</span>?'},
    {t:1.32, o:2.26, a:'A second one,',    b:'sharper and <span class="b">costlier</span>?'},
    {t:2.66, o:3.66, a:'The one that',     b:'actually <span class="b">stings</span>?'}
  ];
  qs.forEach(q=>{
    const L = layer(); win(L, q.t, q.o+.5);
    const wrap = add(L,'div');
    css(wrap,{display:'flex',flexDirection:'column',gap:'14px',alignItems:'center'});
    pop(add(wrap,'div','t lg w300', q.a), q.t,     q.o,     {dy:40, inD:.42, outD:.34, blur:28});
    pop(add(wrap,'div','t lg w300', q.b), q.t+.14, q.o+.05, {dy:40, inD:.42, outD:.34, blur:28});
  });
})();

/* ---- BEAT 2: brand reveal — echoed word, ring bloom, wordmark ------ */
(function meet(){
  const L = layer(); win(L, 4.05, 7.62);

  const stack = add(L,'div');
  css(stack,{position:'absolute',display:'flex',flexDirection:'column',alignItems:'center',gap:'6px'});
  const gA = add(stack,'div','t xl w500','Meet'); css(gA,{color:'rgba(190,212,255,.16)'});
  const m  = add(stack,'div','t xl w500','Meet'); css(m ,{color:'var(--blue2)'});
  const gB = add(stack,'div','t xl w500','Meet'); css(gB,{color:'rgba(190,212,255,.10)'});
  [gA,m,gB].forEach((e,i)=>{
    io(e, S(0,'translateY(60px) scale(.9)','blur(26px)'),
          S(1,'translateY(0px) scale(1)'),
          S(0,'translateY(-40px) scale(1.25)','blur(30px)'), 4.10+i*.07, .55, 5.05, .40);
  });

  [add(L,'div','ring'), add(L,'div','ringSharp')].forEach((r,i)=>{
    io(r, S(0,'scale(.25)'), S(1,'scale(1)'), S(0,'scale(1.5)'),
       5.30+i*.05, .75, 6.98, .55, EASE_OUT, 'ease-in');
  });

  const lock = add(L,'div');
  css(lock,{position:'absolute',display:'flex',flexDirection:'column',alignItems:'center',gap:'18px'});
  const mark = add(lock,'div');
  css(mark,{display:'flex',alignItems:'center',gap:'22px'});
  mark.innerHTML =                                   /* replace with the real mark */
    `<svg width="86" height="86" viewBox="0 0 100 100">
       <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
         <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#6aa1ff"/></linearGradient></defs>
       <path d="M50 6 L94 94 L50 72 L6 94 Z" fill="url(#g1)"/>
     </svg>
     <span style="font-size:96px;font-weight:600;letter-spacing:-2px">${BRAND}</span>`;
  add(lock,'div','t sm w300 soft', TAGLINE);
  io(lock, S(0,'scale(.86)','blur(28px)'), S(1,'scale(1)'), S(0,'scale(1.12)','blur(22px)'),
     5.62, .70, 7.08, .45);
})();

/* ---- BEAT 3: claim — word cycle landing on the one that sticks ----- */
(function claim(){
  const L = layer(); win(L, 7.55, 10.85);
  const wrap = add(L,'div');
  css(wrap,{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px'});

  pop(add(wrap,'div','t lg w300','the most'), 7.60, 10.35, {dy:26, inD:.45});

  const slot = add(wrap,'div');
  css(slot,{position:'relative',height:'112px',width:'980px'});
  ['adjective','adjective','adjective'].forEach((w,i)=>{
    const e = add(slot,'div','t lg w500 b', w);
    css(e,{position:'absolute',left:'0',right:'0',top:'0'});
    const t0 = 7.80 + i*.46;
    swap(e, t0, t0+.24);
  });
  const last = add(slot,'div','t lg w500 b','the one that sticks');
  css(last,{position:'absolute',left:'0',right:'0',top:'0'});
  swap(last, 9.18, 10.35, .26, .38);

  const l3 = add(wrap,'div','t md w300','noun phrase that lands it');
  css(l3,{marginTop:'10px'});
  pop(l3, 9.55, 10.40, {dy:24, inD:.45});
})();

/* ---- BEAT 4: a feature verb over a real mockup ---------------------
   Verbs over empty space read as a pitch deck. Always put software under
   them: DOM + CSS + inline SVG, no chart library, no external requests.
   ------------------------------------------------------------------- */
(function verb(){
  const L = layer(); win(L, 10.8, 14.6);

  const head = add(L,'div');
  css(head,{position:'absolute',top:'250px',display:'flex',alignItems:'center'});
  pop(add(head,'div','t lg w500','Analyse'), 10.85, 14.20, {dy:28});
  const d1 = svg(head, 420, 120, 'M400 12 C 330 -6, 150 22, 40 78');   /* doodle arrow */
  css(d1.s,{position:'absolute',left:'-430px',top:'-4px'});
  const arrow = document.createElementNS('http://www.w3.org/2000/svg','path');
  arrow.setAttribute('class','dpath'); arrow.setAttribute('d','M40 78 L 86 62 M40 78 L 60 34');
  d1.s.appendChild(arrow);
  draw(d1.p, 11.15, .45); draw(arrow, 11.55, .25);
  io(d1.s, S(1), S(1), S(0), 11.15, .01, 14.15, .30);

  const dash = add(L,'div','dash');
  css(dash,{position:'absolute',top:'520px'});
  io(dash, S(0,'translateY(80px) scale(.94)','blur(18px)'),
           S(1,'translateY(0px) scale(1)'),
           S(0,'translateY(-60px) scale(.97)','blur(18px)'),
     11.05, .65, 14.17, .42, EASE_OUT, 'linear');

window.seek = function(t){
  const ms = Math.max(0, t*1000);
  for(const a of anims){ a.currentTime = ms; }
};
window.__ready = false;
document.fonts.ready.then(()=>{ window.seek(0); requestAnimationFrame(()=>{ window.__ready = true; }); });
